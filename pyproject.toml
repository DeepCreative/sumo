[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo"
version = "0.1.0"
description = "SUMO (Suggested Upper Merged Ontology) shared library for the Bravo Zero cognitive architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Bravo Zero", email = "eng@bravozero.ai"},
]

dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["sumo*"]

[tool.setuptools.package-data]
sumo = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
